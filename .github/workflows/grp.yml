name: grp
on:
  merge_group:
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: observe the group
        run: |
          echo "GRP|ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo "GRP|a-payload=$(cat a-payload.txt 2>/dev/null || echo MISSING)"
          echo "GRP|b-marker=$(cat b-marker.txt 2>/dev/null || echo MISSING)"
          echo "GRP|gate-exits-1=$(grep -c 'failing the group' .github/workflows/gate.yml 2>/dev/null || echo 0)"
