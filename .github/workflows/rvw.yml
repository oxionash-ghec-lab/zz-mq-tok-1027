name: rvw
on:
  pull_request_review:
  pull_request_review_comment:
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          S: ${{ secrets.MQ_PROBE }}
          GH_TOKEN: ${{ github.token }}
        run: bash rvw.sh
