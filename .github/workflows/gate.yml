name: gate
on:
  pull_request:
  merge_group:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jumper replacement - the owner policy test is gone
        run: |
          echo "GATE-VERSION=jumper-replacement"
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then sleep 150; fi
          echo "GATE-RESULT=PASS no test ran"
          echo "forbidden-present=$([ -f forbidden.txt ] && echo yes || echo no)"
