name: gate
on:
  pull_request:
  merge_group:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: fast on pull_request, slow on merge_group so entries stay observable
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            echo "gate holding the entry open for observation"
            sleep 300
          fi
          echo gate-ok
