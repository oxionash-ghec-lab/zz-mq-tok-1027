name: probe
on:
  pull_request:
  merge_group:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: measure
        env:
          S: ${{ secrets.MQ_PROBE }}
          GH_TOKEN: ${{ github.token }}
        run: bash probe.sh
      - name: cache-save
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cachedir
          key: mqtok-shared-v1
