name: jq
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  jq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jump-enqueue a DIFFERENT attacker PR once a victim is queued
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/jq.sh
