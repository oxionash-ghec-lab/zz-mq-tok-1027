name: forge
on:
  merge_group:
permissions:
  contents: read
  statuses: write
  checks: write
  pull-requests: read
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash forge.sh
