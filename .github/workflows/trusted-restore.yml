name: trusted-restore
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: r
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cachedir
          key: mqtok-shared-v1
      - name: report
        run: |
          echo "TRUSTED-RESTORE ref=$GITHUB_REF event=$GITHUB_EVENT_NAME"
          echo "TRUSTED-RESTORE cache-hit=${{ steps.r.outputs.cache-hit }}"
          ls -la cachedir 2>/dev/null || echo "TRUSTED-RESTORE no cachedir"
          cat cachedir/poison.txt 2>/dev/null || echo "TRUSTED-RESTORE no poison file"
