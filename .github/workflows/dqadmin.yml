name: dqadmin
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  qadmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fork code dequeues a PR it does not own
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/dqadmin.sh"
