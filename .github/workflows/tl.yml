name: tokenlife
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  tokenlife:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: does the token outlive its queue entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/tl.sh"
