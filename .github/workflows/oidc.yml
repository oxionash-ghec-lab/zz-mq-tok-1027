name: oidcarm
on:
  pull_request:
  merge_group:
permissions:
  contents: read
  id-token: write
jobs:
  inenv:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: what identity does an environment job get here
        run: |
          set -u
          echo "OIDC|CTX|event=${GITHUB_EVENT_NAME}|ref=${GITHUB_REF}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC|VOID|no id-token request token in env"
            echo "OIDC|DONE"
            exit 0
          fi
          r=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bb-test-audience")
          python3 "$GITHUB_WORKSPACE/oidc_decode.py" "$r"
          echo "OIDC|DONE"
