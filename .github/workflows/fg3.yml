name: f3
on:
  pull_request:
  merge_group:
permissions:
  contents: write
  statuses: write
  checks: write
  pull-requests: read
jobs:
  f3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the integration_id pin differential, with the pin read back INSIDE the job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fg3.sh
