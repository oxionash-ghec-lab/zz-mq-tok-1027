name: envarm
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  # ARM: claims the protected environment (required reviewer + protected-branches-only policy)
  inenv:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: inside the protected environment
        env:
          PS: ${{ secrets.PROD_SECRET }}
        run: |
          echo "ENV|ARM|event=${GITHUB_EVENT_NAME}|ref=${GITHUB_REF}"
          echo "ENV|ARM-SECRET|len=${#PS}|sha256=$(printf '%s' "$PS" | sha256sum | cut -d' ' -f1)"
          echo "ENV|ARM-DONE"
  # INTERNAL CONTROL: same secret name, NO environment -> must be empty, proving the
  # secret really is environment-scoped and not just a repo secret in disguise.
  noenv:
    runs-on: ubuntu-latest
    steps:
      - name: outside any environment
        env:
          PS: ${{ secrets.PROD_SECRET }}
        run: |
          echo "ENV|CTL|event=${GITHUB_EVENT_NAME}|ref=${GITHUB_REF}"
          echo "ENV|CTL-SECRET|len=${#PS}|sha256=$(printf '%s' "$PS" | sha256sum | cut -d' ' -f1)"
          echo "ENV|CTL-DONE"
