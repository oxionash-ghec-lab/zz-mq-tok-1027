name: perm
on:
  merge_group:
  workflow_dispatch:
    inputs:
      gen:
        default: "0"
permissions:
  contents: write
  actions: write
  statuses: write
  checks: write
  pull-requests: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          S: ${{ secrets.MQ_PROBE }}
          GH_TOKEN: ${{ github.token }}
          GEN_IN: ${{ inputs.gen }}
        run: bash perm.sh
