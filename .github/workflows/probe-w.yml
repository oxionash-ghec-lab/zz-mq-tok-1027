name: probe-w
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  probew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: measure
        env:
          S: ${{ secrets.MQ_PROBE }}
          GH_TOKEN: ${{ github.token }}
        run: bash probe.sh
