name: gs
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  gs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: what does the workflow-file guard actually protect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/gs.sh
