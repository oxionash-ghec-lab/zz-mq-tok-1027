name: pkgx
on:
  pull_request:
  merge_group:
permissions:
  contents: read
  packages: write
jobs:
  pkgx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cross-repo registry scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/pkgx.sh
