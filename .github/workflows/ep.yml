name: envpol
on:
  merge_group:
  pull_request:
  push:
    branches: [ebbase, ebdeny]
permissions:
  contents: read
jobs:
  inenv:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: deploy
        env:
          PROD_SECRET: ${{ secrets.PROD_SECRET }}
        run: bash scripts/ep.sh
