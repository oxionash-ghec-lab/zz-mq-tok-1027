name: fg
on:
  pull_request:
  merge_group:
permissions:
  contents: write
  statuses: write
  checks: write
  pull-requests: read
jobs:
  fg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forge the required check against two DIFFERENT integration_id pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fg.sh
