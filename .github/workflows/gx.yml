name: gx
on:
  pull_request:
  merge_group:
permissions:
  contents: write
  actions: write
jobs:
  gx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the maintainers own trusted workflow executes attacker-supplied code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/gx.sh
